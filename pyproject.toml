[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-viewer"
version = "1.0.0"
description = "Cross-platform desktop image viewer with EXIF metadata display"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "PySide6>=6.5",
    "Pillow>=10.0",
]

[project.scripts]
image-viewer = "viewer.app:main"

[tool.setuptools.packages.find]
include = ["viewer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

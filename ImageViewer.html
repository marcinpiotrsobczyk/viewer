<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Viewer</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1e1e1e; color: #d0d0d0; font-size: 14px; }

#app { display: flex; flex-direction: column; height: 100vh; }

/* Top bar */
#top-bar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: #2d2d2d; border-bottom: 1px solid #444; flex-shrink: 0; min-height: 38px; }
#top-bar button { background: #3a3a3a; color: #d0d0d0; border: 1px solid #555; padding: 4px 12px; border-radius: 3px; cursor: pointer; font-size: 13px; }
#top-bar button:hover { background: #4a4a4a; }
.sep { color: #666; user-select: none; }
#dir-label { font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 300px; }
#file-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#position-label { margin-left: auto; white-space: nowrap; color: #aaa; font-size: 13px; }

/* Main content area */
#content { display: flex; flex: 1; overflow: hidden; position: relative; }

/* Image viewport */
#viewport { flex: 1; overflow: hidden; position: relative; background: #000; cursor: grab; }
#viewport.dragging { cursor: grabbing; }
#viewport img { position: absolute; transform-origin: 0 0; image-rendering: auto; user-select: none; -webkit-user-drag: none; }

/* Splitter */
#splitter { width: 4px; background: #444; cursor: col-resize; flex-shrink: 0; }
#splitter:hover { background: #2a82da; }

/* Metadata panel */
#metadata-panel { width: 300px; background: #2d2d2d; overflow-y: auto; flex-shrink: 0; padding: 10px; border-left: 1px solid #444; }
#metadata-panel.hidden { display: none; }
#metadata-panel h3 { font-size: 13pt; margin-bottom: 6px; color: #e0e0e0; }
#desc-text { font-size: 11pt; padding: 4px; color: #ddd; margin-bottom: 10px; word-wrap: break-word; }
#desc-text.empty { color: #888; }
.meta-separator { border: none; border-top: 1px solid #555; margin: 8px 0; }
#file-info { font-size: 10pt; color: #bbb; padding: 4px; line-height: 1.6; margin-bottom: 8px; }
#toggle-meta-btn { background: #3a3a3a; color: #d0d0d0; border: 1px solid #555; padding: 4px 10px; border-radius: 3px; cursor: pointer; font-size: 12px; margin-bottom: 8px; width: 100%; }
#toggle-meta-btn:hover { background: #4a4a4a; }
#meta-table-wrap { display: none; max-height: 400px; overflow-y: auto; }
#meta-table { width: 100%; border-collapse: collapse; font-size: 11px; }
#meta-table th { text-align: left; background: #333; padding: 4px 6px; position: sticky; top: 0; }
#meta-table td { padding: 3px 6px; border-bottom: 1px solid #3a3a3a; word-break: break-all; }
#meta-table tr:nth-child(even) { background: #2a2a2a; }

/* Empty state */
#empty-msg { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: #888; font-size: 14pt; line-height: 1.8; }

/* Controls bar */
#controls-bar { text-align: center; background: #252525; color: #888; font-size: 9pt; padding: 3px 8px; flex-shrink: 0; border-top: 1px solid #333; }

/* Status bar */
#status-bar { background: #252525; color: #999; font-size: 11px; padding: 2px 10px; flex-shrink: 0; border-top: 1px solid #333; }

/* Hidden file input */
#folder-input { display: none; }

/* Zoom indicator */
#zoom-indicator { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.7); color: #ccc; padding: 3px 8px; border-radius: 3px; font-size: 12px; pointer-events: none; opacity: 0; transition: opacity 0.3s; }
#zoom-indicator.visible { opacity: 1; }

/* Edit button */
#desc-header { display: flex; align-items: center; justify-content: space-between; }
#desc-header h3 { margin: 0; }
#edit-desc-btn { background: #3a3a3a; color: #d0d0d0; border: 1px solid #555; padding: 2px 10px; border-radius: 3px; cursor: pointer; font-size: 11px; }
#edit-desc-btn:hover { background: #4a4a4a; }
#edit-desc-btn:disabled { opacity: 0.4; cursor: default; }

/* Modal overlay */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: #2d2d2d; border: 1px solid #555; border-radius: 6px; padding: 16px; width: 440px; max-width: 90vw; }
.modal h3 { margin-bottom: 10px; color: #e0e0e0; }
.modal textarea { width: 100%; height: 120px; background: #1e1e1e; color: #d0d0d0; border: 1px solid #555; border-radius: 3px; padding: 8px; font-family: inherit; font-size: 13px; resize: vertical; }
.modal-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
.modal-buttons button { background: #3a3a3a; color: #d0d0d0; border: 1px solid #555; padding: 5px 16px; border-radius: 3px; cursor: pointer; font-size: 13px; }
.modal-buttons button:hover { background: #4a4a4a; }
.modal-buttons button.primary { background: #2a6db5; border-color: #2a82da; }
.modal-buttons button.primary:hover { background: #3580cc; }
</style>
</head>
<body>
<div id="app">
  <div id="top-bar">
    <button id="open-btn">Open Folder</button>
    <span class="sep">|</span>
    <span id="dir-label"></span>
    <span class="sep" id="sep2" style="display:none">|</span>
    <span id="file-label"></span>
    <span id="position-label"></span>
  </div>

  <div id="content">
    <div id="viewport">
      <img id="image" alt="">
      <div id="zoom-indicator"></div>
      <div id="empty-msg">No images found.<br>Use Ctrl+O or the Open Folder button to open a folder.</div>
    </div>
    <div id="splitter"></div>
    <div id="metadata-panel">
      <div id="desc-header"><h3>Description</h3><button id="edit-desc-btn" disabled>Edit</button></div>
      <div id="desc-text" class="empty">(No description)</div>
      <hr class="meta-separator">
      <div id="file-info"></div>
      <button id="toggle-meta-btn">Show All Metadata</button>
      <div id="meta-table-wrap">
        <table id="meta-table">
          <thead><tr><th>Tag</th><th>Value</th></tr></thead>
          <tbody id="meta-table-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="controls-bar">
    &#x2190;&#x2192; Navigate &nbsp;|&nbsp; &#x2191;&#x2193; / Scroll Zoom &nbsp;|&nbsp;
    PgUp/PgDn Groups &nbsp;|&nbsp; Home/End First/Last &nbsp;|&nbsp;
    F Fit &nbsp;|&nbsp; M Metadata &nbsp;|&nbsp; Ctrl+O Open
  </div>
  <div id="status-bar">Ready — Ctrl+O to open a folder</div>
</div>

<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <h3>Edit Description</h3>
    <textarea id="edit-textarea"></textarea>
    <div class="modal-buttons">
      <button id="edit-cancel">Cancel</button>
      <button id="edit-save" class="primary">Save</button>
    </div>
  </div>
</div>

<input type="file" id="folder-input" webkitdirectory multiple>

<script>
"use strict";

const SUPPORTED_EXT = new Set([".jpg",".jpeg",".png",".gif",".bmp",".webp",".tiff",".tif",".svg",".avif"]);
const ZOOM_FACTOR = 1.25;
const ZOOM_MIN = 0.02;
const ZOOM_MAX = 40;

// --- State ---
let groups = [];       // [{dir, images: [{file, name, relPath}]}]
let flat = [];         // [{file, name, dir, groupIdx}]
let groupBounds = [];  // start index of each group
let currentIndex = -1;
let currentZoom = 1;
let fitMode = true;
let imgNaturalW = 0, imgNaturalH = 0;
let panX = 0, panY = 0;
let metaVisible = true;
let allMetaShown = false;
let zoomTimeout = null;
let objectUrls = new Map();
let hasWriteAccess = false; // true when opened via File System Access API
let currentDescription = "";

// --- DOM ---
const $ = id => document.getElementById(id);
const viewport = $("viewport");
const img = $("image");
const dirLabel = $("dir-label");
const fileLabel = $("file-label");
const sep2 = $("sep2");
const posLabel = $("position-label");
const statusBar = $("status-bar");
const emptyMsg = $("empty-msg");
const metaPanel = $("metadata-panel");
const descText = $("desc-text");
const fileInfo = $("file-info");
const metaTableBody = $("meta-table-body");
const metaTableWrap = $("meta-table-wrap");
const toggleMetaBtn = $("toggle-meta-btn");
const zoomInd = $("zoom-indicator");
const folderInput = $("folder-input");
const splitter = $("splitter");
const editBtn = $("edit-desc-btn");
const editModal = $("edit-modal");
const editTextarea = $("edit-textarea");

// --- Folder loading ---
const hasFSAccess = typeof window.showDirectoryPicker === "function";

$("open-btn").addEventListener("click", () => {
  if (hasFSAccess) { openFolderFSAccess(); } else { folderInput.click(); }
});
folderInput.addEventListener("change", onFolderSelected);

async function openFolderFSAccess() {
  let dirHandle;
  try { dirHandle = await window.showDirectoryPicker(); } catch (_) { return; }
  cleanup();
  statusBar.textContent = "Scanning...";
  hasWriteAccess = true;

  const groupsMap = new Map();
  await scanDir(dirHandle, dirHandle.name, groupsMap);
  buildFlatList(groupsMap);
}

async function scanDir(dirHandle, relPath, groupsMap) {
  for await (const entry of dirHandle.values()) {
    if (entry.kind === "file") {
      const ext = entry.name.lastIndexOf(".") >= 0 ? entry.name.substring(entry.name.lastIndexOf(".")).toLowerCase() : "";
      if (!SUPPORTED_EXT.has(ext)) continue;
      if (!groupsMap.has(relPath)) groupsMap.set(relPath, []);
      groupsMap.get(relPath).push({ handle: entry, name: entry.name });
    } else if (entry.kind === "directory") {
      await scanDir(entry, relPath + "/" + entry.name, groupsMap);
    }
  }
}

function onFolderSelected(e) {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  cleanup();
  hasWriteAccess = false;
  statusBar.textContent = "Scanning...";

  const groupsMap = new Map();
  for (const file of files) {
    const ext = file.name.lastIndexOf(".") >= 0 ? file.name.substring(file.name.lastIndexOf(".")).toLowerCase() : "";
    if (!SUPPORTED_EXT.has(ext)) continue;
    const path = file.webkitRelativePath || file.name;
    const parts = path.split("/");
    const dir = parts.length > 2 ? parts.slice(1, -1).join("/") : parts[0];
    if (!groupsMap.has(dir)) groupsMap.set(dir, []);
    groupsMap.get(dir).push({ file, name: file.name });
  }
  buildFlatList(groupsMap);
  folderInput.value = "";
}

function cleanup() {
  for (const url of objectUrls.values()) URL.revokeObjectURL(url);
  objectUrls.clear();
}

function buildFlatList(groupsMap) {
  const sortedDirs = Array.from(groupsMap.keys()).sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" }));
  groups = []; flat = []; groupBounds = [];

  for (const dir of sortedDirs) {
    const images = groupsMap.get(dir).sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: "base" }));
    const groupIdx = groups.length;
    groups.push({ dir, images });
    groupBounds.push(flat.length);
    for (const item of images) {
      flat.push({ ...item, dir, groupIdx });
    }
  }

  if (flat.length === 0) {
    currentIndex = -1;
    showEmpty(true);
    statusBar.textContent = "No images found in folder";
    return;
  }
  showEmpty(false);
  navigateTo(0);
  statusBar.textContent = `Found ${flat.length} images in ${groups.length} directories`;
}

function showEmpty(show) {
  emptyMsg.style.display = show ? "block" : "none";
  img.style.display = show ? "none" : "block";
}

// --- Navigation ---
function navigateTo(index) {
  if (index < 0 || index >= flat.length) return;
  currentIndex = index;
  const entry = flat[index];

  // Update top bar
  dirLabel.textContent = entry.dir;
  fileLabel.textContent = entry.name;
  sep2.style.display = "inline";

  const gi = entry.groupIdx;
  const groupStart = groupBounds[gi];
  const groupSize = gi + 1 < groupBounds.length ? groupBounds[gi + 1] - groupStart : flat.length - groupStart;
  const posInGroup = index - groupStart;
  posLabel.textContent = `${posInGroup + 1}/${groupSize} in group  |  ${index + 1}/${flat.length} total`;

  // Load image
  loadImage(entry);

  // Load metadata
  loadMetadata(entry);
}

async function getFile(entry) {
  if (entry.file) return entry.file;
  if (entry.handle) return await entry.handle.getFile();
  return null;
}

async function loadImage(entry) {
  statusBar.textContent = "Loading...";
  const file = await getFile(entry);
  if (!file) { statusBar.textContent = "Error: cannot read file"; return; }

  // Revoke old URL for this entry if file changed (e.g. after edit)
  const key = entry.handle || entry.file;
  let url = objectUrls.get(key);
  if (url) URL.revokeObjectURL(url);
  url = URL.createObjectURL(file);
  objectUrls.set(key, url);

  const tempImg = new Image();
  tempImg.onload = () => {
    imgNaturalW = tempImg.naturalWidth;
    imgNaturalH = tempImg.naturalHeight;
    img.src = url;
    img.style.display = "block";
    fitMode = true;
    fitInView();
    statusBar.textContent = "Ready";
  };
  tempImg.onerror = () => {
    img.src = "";
    img.style.display = "none";
    statusBar.textContent = `Error loading: ${entry.name}`;
  };
  tempImg.src = url;
}

// --- Zoom & Pan ---
function fitInView() {
  if (!imgNaturalW || !imgNaturalH) return;
  const vw = viewport.clientWidth;
  const vh = viewport.clientHeight;
  const scaleX = vw / imgNaturalW;
  const scaleY = vh / imgNaturalH;
  currentZoom = Math.min(scaleX, scaleY);
  const displayW = imgNaturalW * currentZoom;
  const displayH = imgNaturalH * currentZoom;
  panX = (vw - displayW) / 2;
  panY = (vh - displayH) / 2;
  applyTransform();
  fitMode = true;
  showZoom();
}

function applyTransform() {
  img.style.transform = `translate(${panX}px, ${panY}px) scale(${currentZoom})`;
  img.style.width = imgNaturalW + "px";
  img.style.height = imgNaturalH + "px";
}

function zoomAt(factor, cx, cy) {
  const newZoom = currentZoom * factor;
  if (newZoom < ZOOM_MIN || newZoom > ZOOM_MAX) return;

  // Zoom toward the point (cx, cy) in viewport coords
  const imgX = (cx - panX) / currentZoom;
  const imgY = (cy - panY) / currentZoom;

  currentZoom = newZoom;
  panX = cx - imgX * currentZoom;
  panY = cy - imgY * currentZoom;
  fitMode = false;
  applyTransform();
  showZoom();
}

function zoomCenter(factor) {
  const cx = viewport.clientWidth / 2;
  const cy = viewport.clientHeight / 2;
  zoomAt(factor, cx, cy);
}

function showZoom() {
  zoomInd.textContent = `${(currentZoom * 100).toFixed(0)}%`;
  zoomInd.classList.add("visible");
  clearTimeout(zoomTimeout);
  zoomTimeout = setTimeout(() => zoomInd.classList.remove("visible"), 1200);
}

// Mouse wheel zoom
viewport.addEventListener("wheel", e => {
  e.preventDefault();
  if (!imgNaturalW) return;
  const factor = e.deltaY < 0 ? ZOOM_FACTOR : 1 / ZOOM_FACTOR;
  const rect = viewport.getBoundingClientRect();
  zoomAt(factor, e.clientX - rect.left, e.clientY - rect.top);
}, { passive: false });

// Pan with mouse drag
let dragging = false, dragStartX = 0, dragStartY = 0, panStartX = 0, panStartY = 0;
viewport.addEventListener("mousedown", e => {
  if (e.button !== 0) return;
  dragging = true;
  dragStartX = e.clientX;
  dragStartY = e.clientY;
  panStartX = panX;
  panStartY = panY;
  viewport.classList.add("dragging");
  e.preventDefault();
});
window.addEventListener("mousemove", e => {
  if (!dragging) return;
  panX = panStartX + (e.clientX - dragStartX);
  panY = panStartY + (e.clientY - dragStartY);
  applyTransform();
});
window.addEventListener("mouseup", () => {
  dragging = false;
  viewport.classList.remove("dragging");
});

// Resize → re-fit
window.addEventListener("resize", () => {
  if (fitMode && imgNaturalW) fitInView();
});

// --- Splitter resize ---
let splitting = false, splitStartX = 0, splitStartW = 0;
splitter.addEventListener("mousedown", e => {
  splitting = true;
  splitStartX = e.clientX;
  splitStartW = metaPanel.offsetWidth;
  e.preventDefault();
});
window.addEventListener("mousemove", e => {
  if (!splitting) return;
  const delta = splitStartX - e.clientX;
  const newW = Math.max(150, Math.min(600, splitStartW + delta));
  metaPanel.style.width = newW + "px";
  if (fitMode && imgNaturalW) fitInView();
});
window.addEventListener("mouseup", () => { splitting = false; });

// --- Metadata ---
const WRITABLE_EXT = new Set([".jpg",".jpeg",".png",".tiff",".tif",".webp"]);

async function loadMetadata(entry) {
  const file = await getFile(entry);
  if (!file) return;
  const tags = {};

  const sizeStr = file.size < 1024 ? `${file.size} B`
    : file.size < 1024 * 1024 ? `${(file.size / 1024).toFixed(1)} KB`
    : `${(file.size / (1024 * 1024)).toFixed(1)} MB`;
  const ext = entry.name.lastIndexOf(".") >= 0 ? entry.name.substring(entry.name.lastIndexOf(".") + 1).toUpperCase() : "Unknown";
  const extLower = "." + ext.toLowerCase();

  const fileInfoLines = [`File Size: ${sizeStr}`, `Format: ${ext}`];
  if (imgNaturalW && imgNaturalH) fileInfoLines.push(`Dimensions: ${imgNaturalW} × ${imgNaturalH}`);
  if (file.lastModified) fileInfoLines.push(`Modified: ${new Date(file.lastModified).toLocaleString()}`);
  tags["File Size"] = sizeStr;
  tags["Format"] = ext;
  if (imgNaturalW && imgNaturalH) tags["Dimensions"] = `${imgNaturalW} × ${imgNaturalH}`;
  fileInfo.innerHTML = fileInfoLines.map(l => escHtml(l)).join("<br>");

  let description = null;
  try {
    const exifData = await readExif(file);
    if (exifData) {
      for (const [k, v] of Object.entries(exifData.tags)) tags[k] = v;
      description = exifData.description;
    }
  } catch (_) {}

  currentDescription = description || "";
  if (description) {
    descText.textContent = description;
    descText.classList.remove("empty");
  } else {
    descText.textContent = "(No description)";
    descText.classList.add("empty");
  }

  // Enable edit button only with write access and writable format
  editBtn.disabled = !(hasWriteAccess && entry.handle && WRITABLE_EXT.has(extLower));

  metaTableBody.innerHTML = "";
  for (const key of Object.keys(tags).sort()) {
    const tr = document.createElement("tr");
    const td1 = document.createElement("td"); td1.textContent = key;
    const td2 = document.createElement("td"); td2.textContent = tags[key];
    tr.appendChild(td1); tr.appendChild(td2);
    metaTableBody.appendChild(tr);
  }
}

function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// --- Minimal EXIF reader ---
const EXIF_TAGS = {
  0x010E: "ImageDescription", 0x010F: "Make", 0x0110: "Model",
  0x0112: "Orientation", 0x011A: "XResolution", 0x011B: "YResolution",
  0x0128: "ResolutionUnit", 0x0131: "Software", 0x0132: "DateTime",
  0x013B: "Artist", 0x8298: "Copyright", 0x8769: "ExifIFD", 0x8825: "GPSIFD",
  // ExifIFD tags
  0x829A: "ExposureTime", 0x829D: "FNumber", 0x8822: "ExposureProgram",
  0x8827: "ISOSpeedRatings", 0x9000: "ExifVersion", 0x9003: "DateTimeOriginal",
  0x9004: "DateTimeDigitized", 0x9201: "ShutterSpeedValue", 0x9202: "ApertureValue",
  0x9204: "ExposureBiasValue", 0x9207: "MeteringMode", 0x9209: "Flash",
  0x920A: "FocalLength", 0x9286: "UserComment", 0xA001: "ColorSpace",
  0xA002: "PixelXDimension", 0xA003: "PixelYDimension", 0xA405: "FocalLengthIn35mmFilm",
  0xA406: "SceneCaptureType", 0xA430: "CameraOwnerName", 0xA431: "BodySerialNumber",
  0xA432: "LensInfo", 0xA433: "LensMake", 0xA434: "LensModel",
};

async function readExif(file) {
  const ext = file.name.substring(file.name.lastIndexOf(".")).toLowerCase();

  if (ext === ".png") return readPngTextChunks(file);
  if (ext !== ".jpg" && ext !== ".jpeg" && ext !== ".tiff" && ext !== ".tif" && ext !== ".webp") return null;

  const buf = await file.slice(0, Math.min(file.size, 256 * 1024)).arrayBuffer();
  const view = new DataView(buf);

  // Find EXIF APP1 marker in JPEG
  let offset = 0;
  let littleEndian = false;

  if (view.getUint16(0) === 0xFFD8) {
    // JPEG
    offset = 2;
    while (offset < view.byteLength - 4) {
      const marker = view.getUint16(offset);
      if (marker === 0xFFE1) {
        // APP1
        const len = view.getUint16(offset + 2);
        // Check for "Exif\0\0"
        if (view.getUint32(offset + 4) === 0x45786966 && view.getUint16(offset + 8) === 0x0000) {
          return parseExifTiff(buf, offset + 10);
        }
        // Check for XMP
        const xmpSig = "http://ns.adobe.com/xap/1.0/\0";
        let isXmp = true;
        for (let i = 0; i < xmpSig.length && i + offset + 4 < view.byteLength; i++) {
          if (view.getUint8(offset + 4 + i) !== xmpSig.charCodeAt(i)) { isXmp = false; break; }
        }
        if (isXmp) {
          const xmpStr = new TextDecoder().decode(new Uint8Array(buf, offset + 4 + xmpSig.length, len - 2 - xmpSig.length));
          const xmpDesc = extractXmpDescription(xmpStr);
          if (xmpDesc) return { description: xmpDesc, tags: { "XMP Description": xmpDesc } };
        }
        offset += 2 + len;
      } else if ((marker & 0xFF00) === 0xFF00) {
        if (marker === 0xFFDA) break; // Start of scan
        offset += 2 + view.getUint16(offset + 2);
      } else {
        break;
      }
    }
    return null;
  }

  // TIFF
  if ((view.getUint16(0) === 0x4949 || view.getUint16(0) === 0x4D4D) && view.byteLength > 8) {
    return parseExifTiff(buf, 0);
  }

  // WebP - look for EXIF chunk
  if (view.getUint32(0) === 0x52494646 && view.getUint32(8) === 0x57454250) {
    let off = 12;
    while (off < view.byteLength - 8) {
      const tag = String.fromCharCode(view.getUint8(off), view.getUint8(off+1), view.getUint8(off+2), view.getUint8(off+3));
      const chunkLen = view.getUint32(off + 4, true);
      if (tag === "EXIF") {
        return parseExifTiff(buf, off + 8);
      }
      off += 8 + chunkLen + (chunkLen % 2);
    }
  }

  return null;
}

function parseExifTiff(buf, tiffStart) {
  const view = new DataView(buf);
  if (tiffStart + 8 > buf.byteLength) return null;

  const byteOrder = view.getUint16(tiffStart);
  const le = byteOrder === 0x4949;
  const magic = view.getUint16(tiffStart + 2, le);
  if (magic !== 0x002A) return null;

  const ifd0Offset = view.getUint32(tiffStart + 4, le);
  const tags = {};
  let description = null;

  function readIfd(offset) {
    const abs = tiffStart + offset;
    if (abs + 2 > buf.byteLength) return {};
    const count = view.getUint16(abs, le);
    const result = {};
    for (let i = 0; i < count; i++) {
      const entryOff = abs + 2 + i * 12;
      if (entryOff + 12 > buf.byteLength) break;
      const tagId = view.getUint16(entryOff, le);
      const type = view.getUint16(entryOff + 2, le);
      const numValues = view.getUint32(entryOff + 4, le);
      const valueOffset = entryOff + 8;

      const tagName = EXIF_TAGS[tagId] || `Tag 0x${tagId.toString(16).toUpperCase().padStart(4, "0")}`;
      const val = readTagValue(view, type, numValues, valueOffset, tiffStart, le, buf);
      if (val !== undefined) result[tagName] = val;
    }
    return result;
  }

  const ifd0 = readIfd(ifd0Offset);
  Object.assign(tags, ifd0);

  if (ifd0["ImageDescription"]) description = ifd0["ImageDescription"];

  // Read ExifIFD
  if (ifd0["ExifIFD"]) {
    const exifOffset = parseInt(ifd0["ExifIFD"]);
    if (!isNaN(exifOffset)) {
      const exifTags = readIfd(exifOffset);
      delete tags["ExifIFD"];
      for (const [k, v] of Object.entries(exifTags)) {
        if (k !== "ExifIFD" && k !== "GPSIFD") tags[k] = v;
      }
      // UserComment for description fallback
      if (!description && exifTags["UserComment"]) {
        description = decodeUserComment(exifTags["UserComment"]);
      }
    }
  }

  return { description, tags };
}

function readTagValue(view, type, count, valueOffset, tiffStart, le, buf) {
  // type: 1=BYTE, 2=ASCII, 3=SHORT, 4=LONG, 5=RATIONAL, 7=UNDEFINED, 10=SRATIONAL
  const typeSize = { 1: 1, 2: 1, 3: 2, 4: 4, 5: 8, 7: 1, 9: 4, 10: 8, 12: 8 };
  const size = (typeSize[type] || 1) * count;
  let dataOff = valueOffset;
  if (size > 4) {
    dataOff = tiffStart + view.getUint32(valueOffset, le);
  }
  if (dataOff + size > buf.byteLength) return undefined;

  if (type === 2) { // ASCII
    const bytes = new Uint8Array(buf, dataOff, count);
    let s = "";
    for (let i = 0; i < bytes.length; i++) {
      if (bytes[i] === 0) break;
      s += String.fromCharCode(bytes[i]);
    }
    return s;
  }
  if (type === 3 && count === 1) return view.getUint16(dataOff, le);
  if (type === 4 && count === 1) return view.getUint32(dataOff, le);
  if ((type === 3 || type === 4) && count === 1) {
    return type === 3 ? view.getUint16(dataOff, le) : view.getUint32(dataOff, le);
  }
  if (type === 5 && count === 1) {
    const num = view.getUint32(dataOff, le);
    const den = view.getUint32(dataOff + 4, le);
    return den ? `${num}/${den}` : `${num}`;
  }
  if (type === 10 && count === 1) {
    const num = view.getInt32(dataOff, le);
    const den = view.getInt32(dataOff + 4, le);
    return den ? `${num}/${den}` : `${num}`;
  }
  if (type === 7) { // UNDEFINED - return as hex or raw for UserComment
    return new Uint8Array(buf, dataOff, count);
  }
  if (type === 1 && count <= 8) {
    const vals = [];
    for (let i = 0; i < count; i++) vals.push(view.getUint8(dataOff + i));
    return vals.join(", ");
  }
  // For multi-value SHORT/LONG
  if ((type === 3 || type === 4) && count <= 16) {
    const vals = [];
    for (let i = 0; i < count; i++) {
      vals.push(type === 3 ? view.getUint16(dataOff + i * 2, le) : view.getUint32(dataOff + i * 4, le));
    }
    return vals.join(", ");
  }
  if (type === 5 && count <= 8) {
    const vals = [];
    for (let i = 0; i < count; i++) {
      const n = view.getUint32(dataOff + i * 8, le);
      const d = view.getUint32(dataOff + i * 8 + 4, le);
      vals.push(d ? `${n}/${d}` : `${n}`);
    }
    return vals.join(", ");
  }
  return `(${count} values)`;
}

function decodeUserComment(raw) {
  if (typeof raw === "string") return raw;
  if (!(raw instanceof Uint8Array) || raw.length <= 8) return null;
  const prefix = raw.slice(0, 8);
  const payload = raw.slice(8);
  // ASCII
  const prefStr = String.fromCharCode(...prefix);
  if (prefStr.startsWith("ASCII\0")) {
    return new TextDecoder("ascii").decode(payload).replace(/\0/g, "").trim();
  }
  // UNICODE
  if (prefStr.startsWith("UNICODE\0")) {
    try { return new TextDecoder("utf-16le").decode(payload).replace(/\0/g, "").trim(); } catch (_) {}
    try { return new TextDecoder("utf-16be").decode(payload).replace(/\0/g, "").trim(); } catch (_) {}
  }
  try { return new TextDecoder("utf-8").decode(payload).replace(/\0/g, "").trim(); } catch (_) {}
  return null;
}

function extractXmpDescription(xmpStr) {
  // Simple regex extraction of dc:description
  const match = xmpStr.match(/<dc:description[\s\S]*?<rdf:li[^>]*>([^<]+)<\/rdf:li>/);
  if (match) return match[1].trim();
  // Try attribute form
  const attrMatch = xmpStr.match(/dc:description="([^"]+)"/);
  if (attrMatch) return attrMatch[1].trim();
  return null;
}

async function readPngTextChunks(file) {
  const buf = await file.slice(0, Math.min(file.size, 1024 * 1024)).arrayBuffer();
  const view = new DataView(buf);
  const tags = {};
  let description = null;

  // Verify PNG signature
  if (view.getUint32(0) !== 0x89504E47) return null;

  let offset = 8;
  while (offset + 12 <= buf.byteLength) {
    const len = view.getUint32(offset);
    const typeBytes = new Uint8Array(buf, offset + 4, 4);
    const chunkType = String.fromCharCode(...typeBytes);
    const dataStart = offset + 8;

    if (chunkType === "tEXt" && dataStart + len <= buf.byteLength) {
      const data = new Uint8Array(buf, dataStart, len);
      const nullIdx = data.indexOf(0);
      if (nullIdx > 0) {
        const key = new TextDecoder("latin1").decode(data.slice(0, nullIdx));
        const value = new TextDecoder("latin1").decode(data.slice(nullIdx + 1));
        tags[key] = value;
        if (key.toLowerCase() === "description" && value.trim()) {
          description = value.trim();
        }
      }
    }

    if (chunkType === "iTXt" && dataStart + len <= buf.byteLength) {
      const data = new Uint8Array(buf, dataStart, len);
      const nullIdx = data.indexOf(0);
      if (nullIdx > 0) {
        const key = new TextDecoder("utf-8").decode(data.slice(0, nullIdx));
        // iTXt: keyword \0 compression_flag \0 compression_method \0 language \0 translated_keyword \0 text
        let rest = nullIdx + 1;
        // Skip compression flag, method
        rest += 2;
        // Skip language tag (null terminated)
        while (rest < data.length && data[rest] !== 0) rest++;
        rest++;
        // Skip translated keyword (null terminated)
        while (rest < data.length && data[rest] !== 0) rest++;
        rest++;
        if (rest < data.length) {
          const value = new TextDecoder("utf-8").decode(data.slice(rest));
          tags[key] = value;
          if (key.toLowerCase() === "description" && value.trim()) {
            description = value.trim();
          }
        }
      }
    }

    if (chunkType === "IDAT" || chunkType === "IEND") break;
    offset += 12 + len;
  }

  return Object.keys(tags).length || description ? { description, tags } : null;
}

// --- Metadata toggle ---
toggleMetaBtn.addEventListener("click", () => {
  allMetaShown = !allMetaShown;
  metaTableWrap.style.display = allMetaShown ? "block" : "none";
  toggleMetaBtn.textContent = allMetaShown ? "Hide All Metadata" : "Show All Metadata";
});

// --- Group navigation helpers ---
function groupIndexFor(flatIndex) {
  if (!groupBounds.length) return 0;
  let lo = 0, hi = groupBounds.length - 1;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (groupBounds[mid] <= flatIndex) lo = mid; else hi = mid - 1;
  }
  return lo;
}

function firstOfNextGroup(flatIndex) {
  const gi = groupIndexFor(flatIndex);
  return gi + 1 < groupBounds.length ? groupBounds[gi + 1] : null;
}

function firstOfPrevGroup(flatIndex) {
  const gi = groupIndexFor(flatIndex);
  return gi > 0 ? groupBounds[gi - 1] : null;
}

// --- Keyboard shortcuts ---
document.addEventListener("keydown", e => {
  if (editModal.classList.contains("open")) {
    if (e.key === "Escape") editModal.classList.remove("open");
    return;
  }
  // Ctrl+O
  if ((e.ctrlKey || e.metaKey) && e.key === "o") {
    e.preventDefault();
    if (hasFSAccess) { openFolderFSAccess(); } else { folderInput.click(); }
    return;
  }

  if (e.ctrlKey || e.metaKey || e.altKey) return;

  switch (e.key) {
    case "ArrowLeft":
      e.preventDefault();
      if (currentIndex > 0) navigateTo(currentIndex - 1);
      break;
    case "ArrowRight":
      e.preventDefault();
      if (currentIndex < flat.length - 1) navigateTo(currentIndex + 1);
      break;
    case "ArrowUp":
      e.preventDefault();
      zoomCenter(ZOOM_FACTOR);
      break;
    case "ArrowDown":
      e.preventDefault();
      zoomCenter(1 / ZOOM_FACTOR);
      break;
    case "PageUp":
      e.preventDefault();
      if (currentIndex >= 0) {
        const target = firstOfPrevGroup(currentIndex);
        if (target !== null) navigateTo(target);
      }
      break;
    case "PageDown":
      e.preventDefault();
      if (currentIndex >= 0) {
        const target = firstOfNextGroup(currentIndex);
        if (target !== null) navigateTo(target);
      }
      break;
    case "Home":
      e.preventDefault();
      if (flat.length > 0) navigateTo(0);
      break;
    case "End":
      e.preventDefault();
      if (flat.length > 0) navigateTo(flat.length - 1);
      break;
    case "f": case "F":
      e.preventDefault();
      fitMode = true;
      fitInView();
      break;
    case "m": case "M":
      e.preventDefault();
      metaVisible = !metaVisible;
      metaPanel.classList.toggle("hidden", !metaVisible);
      splitter.style.display = metaVisible ? "" : "none";
      if (fitMode && imgNaturalW) fitInView();
      break;
  }
});

// Double-click to fit
viewport.addEventListener("dblclick", () => {
  fitMode = true;
  fitInView();
});

// --- Edit Description ---
editBtn.addEventListener("click", () => {
  editTextarea.value = currentDescription;
  editModal.classList.add("open");
  editTextarea.focus();
});
$("edit-cancel").addEventListener("click", () => editModal.classList.remove("open"));
editModal.addEventListener("click", e => { if (e.target === editModal) editModal.classList.remove("open"); });
$("edit-save").addEventListener("click", async () => {
  const newText = editTextarea.value;
  editModal.classList.remove("open");
  const entry = flat[currentIndex];
  if (!entry || !entry.handle) return;
  try {
    await writeDescription(entry.handle, newText);
    statusBar.textContent = "Description saved";
    loadMetadata(entry);
  } catch (e) {
    statusBar.textContent = `Error saving: ${e.message}`;
  }
});

async function writeDescription(fileHandle, description) {
  const file = await fileHandle.getFile();
  const buf = await file.arrayBuffer();
  const ext = file.name.substring(file.name.lastIndexOf(".")).toLowerCase();
  let newBuf;
  if (ext === ".png") {
    newBuf = writePngDescription(buf, description);
  } else if (ext === ".jpg" || ext === ".jpeg") {
    newBuf = writeJpegDescription(buf, description);
  } else {
    throw new Error("Unsupported format for description editing");
  }
  const writable = await fileHandle.createWritable();
  await writable.write(newBuf);
  await writable.close();
}

function writeJpegDescription(buf, description) {
  const view = new DataView(buf);
  if (view.getUint16(0) !== 0xFFD8) throw new Error("Not a JPEG");

  // Build a minimal EXIF APP1 with just ImageDescription (tag 270)
  // We'll preserve existing APP1 EXIF and patch tag 270 in, or create new APP1
  const descBytes = new TextEncoder().encode(description);
  // Find existing APP1 EXIF
  let app1Start = -1, app1Len = 0;
  let offset = 2;
  while (offset < view.byteLength - 4) {
    const marker = view.getUint16(offset);
    if (marker === 0xFFE1) {
      const len = view.getUint16(offset + 2);
      if (offset + 4 + 6 <= view.byteLength && view.getUint32(offset + 4) === 0x45786966 && view.getUint16(offset + 8) === 0x0000) {
        app1Start = offset;
        app1Len = len + 2;
      }
      break;
    } else if ((marker & 0xFF00) === 0xFF00) {
      if (marker === 0xFFDA) break;
      offset += 2 + view.getUint16(offset + 2);
    } else { break; }
  }

  if (app1Start >= 0) {
    // Patch existing EXIF: parse TIFF, rebuild IFD0 with new tag 270
    const tiffStart = app1Start + 10;
    const newExif = patchExifDescription(new Uint8Array(buf, tiffStart, app1Len - 10), descBytes);
    // Build: Exif\0\0 + newExif
    const app1Data = new Uint8Array(6 + newExif.length);
    app1Data.set([0x45, 0x78, 0x69, 0x66, 0x00, 0x00]); // "Exif\0\0"
    app1Data.set(newExif, 6);
    const app1Size = 2 + app1Data.length; // length field includes itself
    const before = new Uint8Array(buf, 0, app1Start);
    const after = new Uint8Array(buf, app1Start + app1Len);
    const result = new Uint8Array(before.length + 4 + app1Data.length + after.length);
    result.set(before, 0);
    let p = before.length;
    result[p] = 0xFF; result[p+1] = 0xE1;
    result[p+2] = (app1Size >> 8) & 0xFF; result[p+3] = app1Size & 0xFF;
    result.set(app1Data, p + 4);
    result.set(after, p + 4 + app1Data.length);
    return result.buffer;
  } else {
    // No existing EXIF — create minimal one
    const newExif = buildMinimalExif(descBytes);
    const app1Data = new Uint8Array(6 + newExif.length);
    app1Data.set([0x45, 0x78, 0x69, 0x66, 0x00, 0x00]);
    app1Data.set(newExif, 6);
    const app1Size = 2 + app1Data.length;
    // Insert after SOI (first 2 bytes)
    const result = new Uint8Array(2 + 4 + app1Data.length + buf.byteLength - 2);
    result[0] = 0xFF; result[1] = 0xD8;
    result[2] = 0xFF; result[3] = 0xE1;
    result[4] = (app1Size >> 8) & 0xFF; result[5] = app1Size & 0xFF;
    result.set(app1Data, 6);
    result.set(new Uint8Array(buf, 2), 6 + app1Data.length);
    return result.buffer;
  }
}

function buildMinimalExif(descBytes) {
  // Big-endian TIFF with one IFD entry: tag 270 (ImageDescription)
  const count = descBytes.length + 1; // +1 for null terminator
  const ifdEntries = 1;
  const ifdSize = 2 + ifdEntries * 12 + 4; // count + entries + next_ifd
  const dataOffset = 8 + ifdSize; // after TIFF header + IFD
  const totalSize = dataOffset + count;
  const out = new Uint8Array(totalSize);
  const dv = new DataView(out.buffer);
  // TIFF header: big-endian
  out[0] = 0x4D; out[1] = 0x4D; // "MM"
  dv.setUint16(2, 0x002A);
  dv.setUint32(4, 8); // IFD0 offset
  // IFD0
  dv.setUint16(8, ifdEntries);
  // Entry: tag=270, type=2(ASCII), count, value offset
  dv.setUint16(10, 0x010E);
  dv.setUint16(12, 2); // ASCII
  dv.setUint32(14, count);
  dv.setUint32(18, dataOffset);
  dv.setUint32(22, 0); // next IFD = 0
  // Data
  out.set(descBytes, dataOffset);
  out[dataOffset + descBytes.length] = 0; // null terminator
  return out;
}

function patchExifDescription(tiffBytes, descBytes) {
  // Parse the TIFF, find/replace tag 270, rebuild
  const buf = tiffBytes.buffer.slice(tiffBytes.byteOffset, tiffBytes.byteOffset + tiffBytes.byteLength);
  const view = new DataView(buf);
  const le = view.getUint16(0) === 0x4949;
  const ifd0Off = view.getUint32(4, le);

  if (ifd0Off + 2 > buf.byteLength) return buildMinimalExif(descBytes);
  const entryCount = view.getUint16(ifd0Off, le);

  // Collect all IFD0 entries (raw 12-byte each), their external data, and track tag 270
  const entries = [];
  const externalData = [];
  let has270 = false;
  for (let i = 0; i < entryCount; i++) {
    const eOff = ifd0Off + 2 + i * 12;
    if (eOff + 12 > buf.byteLength) break;
    const tagId = view.getUint16(eOff, le);
    const type = view.getUint16(eOff + 2, le);
    const cnt = view.getUint32(eOff + 4, le);
    if (tagId === 0x010E) { has270 = true; continue; } // skip old 270
    const typeSize = { 1:1, 2:1, 3:2, 4:4, 5:8, 7:1, 9:4, 10:8, 12:8 };
    const dataSize = (typeSize[type] || 1) * cnt;
    let rawData = null;
    if (dataSize > 4) {
      const dataOff = view.getUint32(eOff + 8, le);
      if (dataOff + dataSize <= buf.byteLength) {
        rawData = new Uint8Array(buf, dataOff, dataSize);
      }
    }
    entries.push({ tagId, type, cnt, valueBytes: new Uint8Array(buf, eOff + 8, 4), rawData });
  }

  // Now rebuild: TIFF header + IFD0 with entries + tag 270 + external data
  const newEntryCount = entries.length + 1; // existing (minus old 270) + new 270
  const descCount = descBytes.length + 1;
  const ifdStart = 8;
  const ifdBodySize = 2 + newEntryCount * 12 + 4;
  // External data starts after IFD
  let extOff = ifdStart + ifdBodySize;

  // Build entries sorted by tag (TIFF requires sorted tags)
  const allEntries = [...entries, { tagId: 0x010E, type: 2, cnt: descCount, rawData: null, isDesc: true }];
  allEntries.sort((a, b) => a.tagId - b.tagId);

  // First pass: calculate total size
  let totalExt = 0;
  for (const e of allEntries) {
    if (e.isDesc) { totalExt += descCount; }
    else if (e.rawData) { totalExt += e.rawData.length; }
  }
  const totalSize = ifdStart + ifdBodySize + totalExt;
  const out = new Uint8Array(totalSize);
  const outView = new DataView(out.buffer);

  // TIFF header
  if (le) { out[0] = 0x49; out[1] = 0x49; } else { out[0] = 0x4D; out[1] = 0x4D; }
  outView.setUint16(2, 0x002A, le);
  outView.setUint32(4, ifdStart, le);

  // IFD0
  outView.setUint16(ifdStart, newEntryCount, le);
  let curExt = extOff;
  for (let i = 0; i < allEntries.length; i++) {
    const e = allEntries[i];
    const off = ifdStart + 2 + i * 12;
    outView.setUint16(off, e.tagId, le);
    outView.setUint16(off + 2, e.type, le);
    outView.setUint32(off + 4, e.cnt, le);

    if (e.isDesc) {
      if (descCount <= 4) {
        const tmp = new Uint8Array(4);
        tmp.set(descBytes); tmp[descBytes.length] = 0;
        out.set(tmp, off + 8);
      } else {
        outView.setUint32(off + 8, curExt, le);
        out.set(descBytes, curExt);
        out[curExt + descBytes.length] = 0;
        curExt += descCount;
      }
    } else if (e.rawData) {
      outView.setUint32(off + 8, curExt, le);
      out.set(e.rawData, curExt);
      curExt += e.rawData.length;
    } else {
      out.set(e.valueBytes, off + 8);
    }
  }
  outView.setUint32(ifdStart + 2 + newEntryCount * 12, 0, le); // next IFD = 0
  return out;
}

function writePngDescription(buf, description) {
  const view = new DataView(buf);
  if (view.getUint32(0) !== 0x89504E47) throw new Error("Not a PNG");

  // Collect all chunks, removing old "Description" tEXt chunks
  const chunks = [];
  let offset = 8;
  while (offset + 8 <= buf.byteLength) {
    const len = view.getUint32(offset);
    const typeBytes = new Uint8Array(buf, offset + 4, 4);
    const chunkType = String.fromCharCode(...typeBytes);
    const chunkTotal = 12 + len; // length(4) + type(4) + data(len) + crc(4)
    if (offset + chunkTotal > buf.byteLength) break;
    const chunkData = new Uint8Array(buf, offset, chunkTotal);

    // Skip existing Description tEXt
    if (chunkType === "tEXt") {
      const data = new Uint8Array(buf, offset + 8, len);
      const nullIdx = data.indexOf(0);
      if (nullIdx > 0) {
        const key = new TextDecoder("latin1").decode(data.slice(0, nullIdx));
        if (key.toLowerCase() === "description") { offset += chunkTotal; continue; }
      }
    }
    chunks.push({ type: chunkType, raw: new Uint8Array(chunkData) });
    offset += chunkTotal;
  }

  // Build new tEXt chunk: "Description\0<text>"
  const keyBytes = new TextEncoder().encode("Description");
  const valBytes = new TextEncoder().encode(description);
  const tEXtData = new Uint8Array(keyBytes.length + 1 + valBytes.length);
  tEXtData.set(keyBytes);
  tEXtData[keyBytes.length] = 0;
  tEXtData.set(valBytes, keyBytes.length + 1);
  const newChunk = buildPngChunk("tEXt", tEXtData);

  // Insert before first IDAT
  const idatIdx = chunks.findIndex(c => c.type === "IDAT");
  const insertAt = idatIdx >= 0 ? idatIdx : chunks.length - 1;

  // Calculate total size
  let totalSize = 8; // PNG signature
  for (let i = 0; i < chunks.length; i++) {
    if (i === insertAt) totalSize += newChunk.length;
    totalSize += chunks[i].raw.length;
  }
  if (insertAt >= chunks.length) totalSize += newChunk.length;

  const result = new Uint8Array(totalSize);
  result.set(new Uint8Array(buf, 0, 8)); // PNG signature
  let p = 8;
  for (let i = 0; i < chunks.length; i++) {
    if (i === insertAt) { result.set(newChunk, p); p += newChunk.length; }
    result.set(chunks[i].raw, p); p += chunks[i].raw.length;
  }
  if (insertAt >= chunks.length) { result.set(newChunk, p); }
  return result.buffer;
}

function buildPngChunk(type, data) {
  const chunk = new Uint8Array(12 + data.length);
  const dv = new DataView(chunk.buffer);
  dv.setUint32(0, data.length);
  for (let i = 0; i < 4; i++) chunk[4 + i] = type.charCodeAt(i);
  chunk.set(data, 8);
  // CRC over type + data
  const crc = crc32(chunk.subarray(4, 8 + data.length));
  dv.setUint32(8 + data.length, crc);
  return chunk;
}

// CRC32 for PNG
const crcTable = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c;
  }
  return t;
})();
function crc32(bytes) {
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) crc = crcTable[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

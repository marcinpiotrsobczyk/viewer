<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Viewer</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; background: #1e1e1e; color: #d0d0d0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; }

/* Layout */
#app { display: flex; flex-direction: column; height: 100vh; }
#topBar { display: flex; align-items: center; padding: 4px 10px; background: #2d2d2d;
  border-bottom: 1px solid #444; min-height: 34px; gap: 8px; flex-shrink: 0; }
#mainArea { display: flex; flex: 1; min-height: 0; }
#controlsBar { display: flex; align-items: center; justify-content: center; padding: 3px 10px;
  background: #252525; border-top: 1px solid #333; font-size: 9pt; color: #888; flex-shrink: 0; }
#statusBar { display: flex; align-items: center; padding: 3px 10px; background: #2d2d2d;
  border-top: 1px solid #444; font-size: 11px; color: #888; flex-shrink: 0; min-height: 24px; }

/* Top Bar */
#btnOpen { background: #3a3a3a; color: #d0d0d0; border: 1px solid #555; padding: 4px 12px;
  border-radius: 3px; cursor: pointer; font-size: 12px; white-space: nowrap; }
#btnOpen:hover { background: #4a4a4a; }
.topSep { width: 1px; height: 18px; background: #555; flex-shrink: 0; }
#topDirName { font-weight: bold; max-width: 300px; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; }
#topFileName { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
#topPosition { margin-left: auto; white-space: nowrap; color: #888; flex-shrink: 0; }

/* Dir Tree Panel */
#dirTreePanel { width: 220px; min-width: 120px; max-width: 500px; background: #2d2d2d;
  border-right: 1px solid #444; overflow-y: auto; flex-shrink: 0; display: none; }
#dirTreePanel.visible { display: block; }
.dirEntry { padding: 4px 8px 4px 12px; cursor: pointer; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; font-size: 12px; border-left: 3px solid transparent; }
.dirEntry:hover { background: #353535; }
.dirEntry.active { border-left-color: #2a82da; color: #fff; background: #353535; }
.dirCount { color: #888; margin-left: 4px; }

/* Splitters */
.splitter { width: 4px; background: #444; cursor: col-resize; flex-shrink: 0; }
.splitter:hover, .splitter.dragging { background: #2a82da; }
#leftSplitter { display: none; }
#dirTreePanel.visible ~ #leftSplitter { display: block; }

/* Viewport */
#viewport { flex: 1; position: relative; background: #000; overflow: hidden; cursor: grab;
  min-width: 100px; }
#viewport.dragging { cursor: grabbing; }
#viewportImg { position: absolute; top: 0; left: 0; transform-origin: 0 0; user-select: none;
  -webkit-user-drag: none; image-rendering: auto; }
#emptyState { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: #888; font-size: 15px; text-align: center; padding: 20px; pointer-events: none; }
#zoomIndicator { position: absolute; bottom: 12px; right: 12px; background: rgba(0,0,0,0.7);
  color: #ccc; padding: 4px 10px; border-radius: 4px; font-size: 12px; opacity: 0;
  transition: opacity 0.3s; pointer-events: none; }
#zoomIndicator.show { opacity: 1; }

/* Metadata Panel */
#rightSplitter { display: none; }
#metaPanel { width: 300px; min-width: 150px; max-width: 600px; background: #2d2d2d;
  border-left: 1px solid #444; overflow-y: auto; flex-shrink: 0; display: none; padding: 10px; }
#metaPanel.visible { display: block; }
#metaPanel.visible ~ #rightSplitter { display: block; }
.metaPanel-visible #rightSplitter { display: block; }

#descHeader { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
#descHeader h3 { font-size: 13px; font-weight: 600; }
#btnEditDesc { background: #3a3a3a; color: #d0d0d0; border: 1px solid #555; padding: 2px 10px;
  border-radius: 3px; cursor: pointer; font-size: 11px; }
#btnEditDesc:hover:not(.disabled) { background: #4a4a4a; }
#btnEditDesc.disabled { color: #666; background: #333; border-color: #444; cursor: default; }
#descText { font-size: 12px; color: #d0d0d0; white-space: pre-wrap; word-break: break-word;
  margin-bottom: 10px; min-height: 20px; }
#descText.empty { color: #666; font-style: italic; }
.metaSep { border: none; border-top: 1px solid #444; margin: 8px 0; }
#fileInfo { font-size: 11px; color: #aaa; line-height: 1.6; margin-bottom: 8px; }
#btnShowAllMeta { background: #3a3a3a; color: #d0d0d0; border: 1px solid #555; padding: 3px 10px;
  border-radius: 3px; cursor: pointer; font-size: 11px; margin-bottom: 8px; width: 100%; }
#btnShowAllMeta:hover { background: #4a4a4a; }
#tagsTable { width: 100%; border-collapse: collapse; font-size: 11px; display: none; }
#tagsTable.visible { display: table; }
#tagsTable th { position: sticky; top: 0; background: #2d2d2d; text-align: left; padding: 4px 6px;
  border-bottom: 1px solid #555; font-weight: 600; }
#tagsTable td { padding: 3px 6px; vertical-align: top; word-break: break-all; }
#tagsTable tr:nth-child(even) td { background: #333; }
#tagsTable tr:nth-child(odd) td { background: #2d2d2d; }
#tagsTable td:first-child { white-space: nowrap; color: #aaa; width: 140px; }

/* Modal */
#modalOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none;
  align-items: center; justify-content: center; z-index: 1000; }
#modalOverlay.open { display: flex; }
#modalBox { background: #2d2d2d; border: 1px solid #555; border-radius: 6px; padding: 16px;
  width: 450px; max-width: 90vw; }
#modalBox h3 { margin-bottom: 10px; font-size: 14px; }
#modalTextarea { width: 100%; height: 120px; background: #1e1e1e; color: #d0d0d0; border: 1px solid #555;
  border-radius: 3px; padding: 8px; font-family: inherit; font-size: 13px; resize: vertical; }
#modalBtns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
#modalBtns button { padding: 5px 16px; border-radius: 3px; cursor: pointer; font-size: 12px;
  border: 1px solid #555; }
#btnModalCancel { background: #3a3a3a; color: #d0d0d0; }
#btnModalCancel:hover { background: #4a4a4a; }
#btnModalSave { background: #2a82da; color: #fff; border-color: #2a82da; }
#btnModalSave:hover { background: #3590e8; }

/* Hidden file input */
#folderInput { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="topBar">
    <button id="btnOpen">Open Folder</button>
    <div class="topSep"></div>
    <span id="topDirName"></span>
    <div class="topSep" id="topSep2" style="display:none"></div>
    <span id="topFileName"></span>
    <span id="topPosition"></span>
  </div>
  <div id="mainArea">
    <div id="dirTreePanel"></div>
    <div class="splitter" id="leftSplitter"></div>
    <div id="viewport">
      <img id="viewportImg" style="display:none" draggable="false">
      <div id="emptyState">No images loaded.<br>Use <b>Ctrl+O</b> or the <b>Open Folder</b> button to open a folder.</div>
      <div id="zoomIndicator"></div>
    </div>
    <div class="splitter" id="rightSplitter"></div>
    <div id="metaPanel">
      <div id="descHeader"><h3>Description</h3><button id="btnEditDesc" class="disabled" title="No write access">Edit</button></div>
      <div id="descText" class="empty">(No description)</div>
      <hr class="metaSep">
      <div id="fileInfo"></div>
      <button id="btnShowAllMeta">Show All Metadata</button>
      <table id="tagsTable"><thead><tr><th>Tag</th><th>Value</th></tr></thead><tbody id="tagsBody"></tbody></table>
    </div>
  </div>
  <div id="controlsBar">&larr; &rarr; Navigate &nbsp;|&nbsp; Up/Down / Scroll Zoom &nbsp;|&nbsp; PgUp/PgDn Directory &nbsp;|&nbsp; Home/End First/Last &nbsp;|&nbsp; F Fit &nbsp;|&nbsp; M Metadata &nbsp;|&nbsp; Ctrl+O Open</div>
  <div id="statusBar"><span id="statusText">Ready</span></div>
</div>

<div id="modalOverlay">
  <div id="modalBox">
    <h3>Edit Description</h3>
    <textarea id="modalTextarea"></textarea>
    <div id="modalBtns">
      <button id="btnModalCancel">Cancel</button>
      <button id="btnModalSave">Save</button>
    </div>
  </div>
</div>

<input type="file" id="folderInput" webkitdirectory multiple>

<script>
(function(){
"use strict";

// --- Refs ---
const $btnOpen = document.getElementById('btnOpen');
const $folderInput = document.getElementById('folderInput');
const $topDirName = document.getElementById('topDirName');
const $topSep2 = document.getElementById('topSep2');
const $topFileName = document.getElementById('topFileName');
const $topPosition = document.getElementById('topPosition');
const $dirTreePanel = document.getElementById('dirTreePanel');
const $leftSplitter = document.getElementById('leftSplitter');
const $viewport = document.getElementById('viewport');
const $img = document.getElementById('viewportImg');
const $emptyState = document.getElementById('emptyState');
const $zoomInd = document.getElementById('zoomIndicator');
const $rightSplitter = document.getElementById('rightSplitter');
const $metaPanel = document.getElementById('metaPanel');
const $btnEditDesc = document.getElementById('btnEditDesc');
const $descText = document.getElementById('descText');
const $fileInfo = document.getElementById('fileInfo');
const $btnShowAllMeta = document.getElementById('btnShowAllMeta');
const $tagsTable = document.getElementById('tagsTable');
const $tagsBody = document.getElementById('tagsBody');
const $modalOverlay = document.getElementById('modalOverlay');
const $modalTextarea = document.getElementById('modalTextarea');
const $btnModalCancel = document.getElementById('btnModalCancel');
const $btnModalSave = document.getElementById('btnModalSave');
const $statusText = document.getElementById('statusText');

// --- State ---
const IMAGE_EXTS = new Set(['jpg','jpeg','png','gif','bmp','webp','tiff','tif','svg','avif']);
let groups = [];       // [{dir, images:[{handle/file, name, dir, groupIdx}]}]
let flat = [];         // flattened image entries
let groupBounds = [];  // starting flat index of each group
let currentIdx = -1;
let rootDirName = '';
let useFSAPI = false;  // true if opened via showDirectoryPicker
let zoom = 1, panX = 0, panY = 0;
let naturalW = 0, naturalH = 0;
let isFitMode = true;
let modalOpen = false;
let metaVisible = true;
let allMetaVisible = false;
let currentMeta = null; // {tags, description}
let currentDescription = '';
const urlCache = new Map();
let zoomTimer = null;

// --- Helpers ---
function setStatus(msg) { $statusText.textContent = msg; }
function fileExt(name) { const i = name.lastIndexOf('.'); return i >= 0 ? name.slice(i+1).toLowerCase() : ''; }
function isImage(name) { return IMAGE_EXTS.has(fileExt(name)); }
function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/(1024*1024)).toFixed(2) + ' MB';
}

// --- CRC32 ---
const crcTable = new Uint32Array(256);
(function(){
  for (let n=0; n<256; n++) {
    let c = n;
    for (let k=0; k<8; k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1);
    crcTable[n] = c;
  }
})();
function crc32(buf, start, len) {
  let c = 0xFFFFFFFF;
  for (let i=start; i<start+len; i++) c = crcTable[(c^buf[i])&0xFF] ^ (c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}

// --- Object URL Management ---
function getObjectURL(entry) {
  if (urlCache.has(entry)) return urlCache.get(entry);
  return null;
}
async function createObjectURL(entry) {
  revokeObjectURL(entry);
  let file;
  if (entry.handle) {
    file = await entry.handle.getFile();
  } else {
    file = entry.file;
  }
  const url = URL.createObjectURL(file);
  urlCache.set(entry, url);
  return url;
}
function revokeObjectURL(entry) {
  if (urlCache.has(entry)) {
    URL.revokeObjectURL(urlCache.get(entry));
    urlCache.delete(entry);
  }
}
function revokeAllURLs() {
  for (const url of urlCache.values()) URL.revokeObjectURL(url);
  urlCache.clear();
}

// --- Folder Opening ---
$btnOpen.addEventListener('click', openFolder);

async function openFolder() {
  if (window.showDirectoryPicker) {
    try {
      const dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
      useFSAPI = true;
      rootDirName = dirHandle.name;
      setStatus('Scanning...');
      const entries = [];
      await scanDir(dirHandle, '', entries);
      buildGroups(entries);
    } catch(e) {
      if (e.name !== 'AbortError') setStatus('Error: ' + e.message);
      return;
    }
  } else {
    $folderInput.click();
    return;
  }
}

$folderInput.addEventListener('change', function() {
  const files = Array.from(this.files);
  if (!files.length) return;
  useFSAPI = false;
  const parts = (files[0].webkitRelativePath || '').split('/');
  rootDirName = parts[0] || 'Folder';
  setStatus('Scanning...');
  const entries = [];
  for (const f of files) {
    if (!isImage(f.name)) continue;
    const rel = f.webkitRelativePath || f.name;
    const segs = rel.split('/');
    const dir = segs.length > 2 ? segs.slice(1, segs.length-1).join('/') : '.';
    entries.push({ file: f, name: f.name, dir });
  }
  buildGroups(entries);
  this.value = '';
});

async function scanDir(dirHandle, path, entries) {
  for await (const entry of dirHandle.values()) {
    if (entry.kind === 'file' && isImage(entry.name)) {
      entries.push({ handle: entry, name: entry.name, dir: path || '.' });
    } else if (entry.kind === 'directory') {
      await scanDir(entry, path ? path + '/' + entry.name : entry.name, entries);
    }
  }
}

function buildGroups(entries) {
  revokeAllURLs();
  const map = new Map();
  for (const e of entries) {
    if (!map.has(e.dir)) map.set(e.dir, []);
    map.get(e.dir).push(e);
  }
  const dirs = Array.from(map.keys()).sort((a,b) => a.toLowerCase().localeCompare(b.toLowerCase()));
  groups = [];
  flat = [];
  groupBounds = [];
  for (const d of dirs) {
    const imgs = map.get(d).sort((a,b) => a.name.toLowerCase().localeCompare(b.name.toLowerCase()));
    const gIdx = groups.length;
    groupBounds.push(flat.length);
    for (const img of imgs) { img.groupIdx = gIdx; flat.push(img); }
    groups.push({ dir: d, images: imgs });
  }
  buildDirTree();
  if (flat.length > 0) {
    setStatus('Found ' + flat.length + ' images in ' + groups.length + ' directories.');
    navigate(0);
  } else {
    currentIdx = -1;
    $img.style.display = 'none';
    $emptyState.style.display = 'flex';
    $emptyState.innerHTML = 'No images found.<br>Use <b>Ctrl+O</b> or the <b>Open Folder</b> button to open a folder.';
    setStatus('No images found.');
    updateTopBar();
  }
}

// --- Directory Tree ---
function buildDirTree() {
  $dirTreePanel.innerHTML = '';
  for (let i=0; i<groups.length; i++) {
    const div = document.createElement('div');
    div.className = 'dirEntry';
    div.dataset.groupIdx = i;
    const label = groups[i].dir === '.' ? rootDirName : groups[i].dir;
    div.innerHTML = '<span class="dirLabel">' + escHtml(label) + '</span><span class="dirCount">(' + groups[i].images.length + ')</span>';
    div.addEventListener('click', () => navigate(groupBounds[i]));
    $dirTreePanel.appendChild(div);
  }
  $dirTreePanel.classList.add('visible');
}

function updateDirTreeActive(gIdx) {
  const entries = $dirTreePanel.querySelectorAll('.dirEntry');
  entries.forEach(e => e.classList.toggle('active', +e.dataset.groupIdx === gIdx));
  const active = $dirTreePanel.querySelector('.dirEntry.active');
  if (active) active.scrollIntoView({ block: 'nearest' });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// --- Navigation ---
async function navigate(idx) {
  if (idx < 0 || idx >= flat.length) return;
  currentIdx = idx;
  const entry = flat[idx];
  setStatus('Loading...');
  $emptyState.style.display = 'none';

  try {
    const url = await createObjectURL(entry);
    $img.onload = function() {
      naturalW = $img.naturalWidth;
      naturalH = $img.naturalHeight;
      $img.style.width = naturalW + 'px';
      $img.style.height = naturalH + 'px';
      $img.style.display = 'block';
      fitToView();
      setStatus('Zoom: ' + Math.round(zoom * 100) + '%');
    };
    $img.src = url;
  } catch(e) {
    setStatus('Error loading image: ' + e.message);
  }

  updateTopBar();
  updateDirTreeActive(entry.groupIdx);
  loadMetadata(entry);
}

function updateTopBar() {
  $topDirName.textContent = rootDirName;
  if (currentIdx >= 0 && flat[currentIdx]) {
    const entry = flat[currentIdx];
    $topSep2.style.display = '';
    $topFileName.textContent = entry.name;
    const gIdx = entry.groupIdx;
    const posInDir = currentIdx - groupBounds[gIdx] + 1;
    const dirTotal = groups[gIdx].images.length;
    $topPosition.textContent = posInDir + '/' + dirTotal + ' in dir  |  ' + (currentIdx+1) + '/' + flat.length + ' total';
  } else {
    $topSep2.style.display = 'none';
    $topFileName.textContent = '';
    $topPosition.textContent = '';
  }
}

// --- Image Display ---
function fitToView() {
  if (!naturalW || !naturalH) return;
  const vw = $viewport.clientWidth, vh = $viewport.clientHeight;
  zoom = Math.min(vw / naturalW, vh / naturalH);
  panX = (vw - naturalW * zoom) / 2;
  panY = (vh - naturalH * zoom) / 2;
  isFitMode = true;
  applyTransform();
}

function applyTransform() {
  $img.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + zoom + ')';
}

function showZoomIndicator() {
  $zoomInd.textContent = Math.round(zoom * 100) + '%';
  $zoomInd.classList.add('show');
  clearTimeout(zoomTimer);
  zoomTimer = setTimeout(() => $zoomInd.classList.remove('show'), 1200);
}

function zoomAt(cx, cy, factor) {
  const newZoom = Math.min(40, Math.max(0.02, zoom * factor));
  const r = newZoom / zoom;
  panX = cx - (cx - panX) * r;
  panY = cy - (cy - panY) * r;
  zoom = newZoom;
  isFitMode = false;
  applyTransform();
  showZoomIndicator();
  setStatus('Zoom: ' + Math.round(zoom * 100) + '%');
}

// Mouse drag
let dragging = false, dragStartX, dragStartY, panStartX, panStartY;

$viewport.addEventListener('mousedown', e => {
  if (e.button !== 0 || currentIdx < 0) return;
  dragging = true;
  dragStartX = e.clientX; dragStartY = e.clientY;
  panStartX = panX; panStartY = panY;
  $viewport.classList.add('dragging');
  e.preventDefault();
});

window.addEventListener('mousemove', e => {
  if (!dragging) return;
  panX = panStartX + (e.clientX - dragStartX);
  panY = panStartY + (e.clientY - dragStartY);
  isFitMode = false;
  applyTransform();
});

window.addEventListener('mouseup', () => {
  if (dragging) { dragging = false; $viewport.classList.remove('dragging'); }
});

// Mouse wheel zoom
$viewport.addEventListener('wheel', e => {
  if (currentIdx < 0) return;
  e.preventDefault();
  const rect = $viewport.getBoundingClientRect();
  const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
  const factor = e.deltaY < 0 ? 1.25 : 1/1.25;
  zoomAt(cx, cy, factor);
}, { passive: false });

// Double-click fit
$viewport.addEventListener('dblclick', () => {
  if (currentIdx >= 0) fitToView();
});

// Resize
window.addEventListener('resize', () => { if (isFitMode && currentIdx >= 0) fitToView(); });

// --- Metadata ---
const EXIF_TAG_NAMES = {
  0x010E:'ImageDescription',0x010F:'Make',0x0110:'Model',0x0112:'Orientation',
  0x011A:'XResolution',0x011B:'YResolution',0x0128:'ResolutionUnit',0x0131:'Software',
  0x0132:'DateTime',0x013B:'Artist',0x8298:'Copyright',0x8769:'ExifIFD',0x8825:'GPSIFD',
  0x829A:'ExposureTime',0x829D:'FNumber',0x8827:'ISOSpeedRatings',0x9000:'ExifVersion',
  0x9003:'DateTimeOriginal',0x9004:'DateTimeDigitized',0x9286:'UserComment',0x920A:'FocalLength',
  0xA002:'PixelXDimension',0xA003:'PixelYDimension',0xA433:'LensMake',0xA434:'LensModel',
  0xA405:'FocalLengthIn35mmFilm',0xA406:'SceneCaptureType',0x0100:'ImageWidth',0x0101:'ImageLength',
  0x0102:'BitsPerSample',0x0103:'Compression',0x0106:'PhotometricInterpretation',
  0x9201:'ShutterSpeedValue',0x9202:'ApertureValue',0x9203:'BrightnessValue',
  0x9204:'ExposureBiasValue',0x9205:'MaxApertureValue',0x9207:'MeteringMode',
  0x9208:'LightSource',0x9209:'Flash',0xA001:'ColorSpace',0xA210:'FocalPlaneResolutionUnit',
  0xA401:'CustomRendered',0xA402:'ExposureMode',0xA403:'WhiteBalance',0xA404:'DigitalZoomRatio',
};

function readU16(dv, off, le) { return dv.getUint16(off, le); }
function readU32(dv, off, le) { return dv.getUint32(off, le); }
function readS32(dv, off, le) { return dv.getInt32(off, le); }

function readAscii(dv, off, count) {
  let s = '';
  for (let i=0; i<count; i++) {
    const c = dv.getUint8(off+i);
    if (c === 0) break;
    s += String.fromCharCode(c);
  }
  return s;
}

function readIFDValue(dv, type, count, valueOff, tiffStart, le) {
  const off = tiffStart + valueOff;
  switch(type) {
    case 1: // BYTE
      if (count === 1) return dv.getUint8(off);
      { let a=[]; for(let i=0;i<count;i++) a.push(dv.getUint8(off+i)); return a.join(', '); }
    case 2: // ASCII
      return readAscii(dv, off, count);
    case 3: // SHORT
      if (count === 1) return readU16(dv, off, le);
      { let a=[]; for(let i=0;i<count;i++) a.push(readU16(dv,off+i*2,le)); return a.join(', '); }
    case 4: // LONG
      if (count === 1) return readU32(dv, off, le);
      { let a=[]; for(let i=0;i<count;i++) a.push(readU32(dv,off+i*4,le)); return a.join(', '); }
    case 5: // RATIONAL
      { let a=[]; for(let i=0;i<count;i++){
        const n=readU32(dv,off+i*8,le), d=readU32(dv,off+i*8+4,le);
        a.push(d?n/d:0);
      } return count===1?a[0]:a.join(', '); }
    case 7: // UNDEFINED
      { let a=[]; for(let i=0;i<Math.min(count,64);i++) a.push(dv.getUint8(off+i)); return a; }
    case 9: // SLONG
      if (count === 1) return readS32(dv, off, le);
      { let a=[]; for(let i=0;i<count;i++) a.push(readS32(dv,off+i*4,le)); return a.join(', '); }
    case 10: // SRATIONAL
      { let a=[]; for(let i=0;i<count;i++){
        const n=readS32(dv,off+i*8,le), d=readS32(dv,off+i*8+4,le);
        a.push(d?n/d:0);
      } return count===1?a[0]:a.join(', '); }
    default: return '(type '+type+')';
  }
}

function parseIFD(dv, ifdOff, tiffStart, le) {
  const tags = {};
  const count = readU16(dv, tiffStart + ifdOff, le);
  for (let i=0; i<count; i++) {
    const entryOff = tiffStart + ifdOff + 2 + i*12;
    if (entryOff + 12 > dv.byteLength) break;
    const tag = readU16(dv, entryOff, le);
    const type = readU16(dv, entryOff+2, le);
    const cnt = readU32(dv, entryOff+4, le);
    const typeSizes = {1:1,2:1,3:2,4:4,5:8,7:1,9:4,10:8};
    const sz = (typeSizes[type]||1)*cnt;
    let valueOff;
    if (sz <= 4) {
      // value is inline
      valueOff = entryOff - tiffStart + 8;
      // For inline values, we need to read from entryOff+8 relative to buffer start
      // but readIFDValue expects tiffStart + valueOff, so:
      valueOff = entryOff + 8 - tiffStart;
    } else {
      valueOff = readU32(dv, entryOff+8, le);
    }
    try {
      tags[tag] = readIFDValue(dv, type, cnt, valueOff, tiffStart, le);
    } catch(e) {
      // skip unreadable tag
    }
  }
  return tags;
}

function decodeUserComment(raw) {
  if (!Array.isArray(raw) || raw.length < 8) return null;
  const prefix = raw.slice(0,8);
  const payload = raw.slice(8);
  const isAscii = prefix[0]===0x41 && prefix[1]===0x53 && prefix[2]===0x43 && prefix[3]===0x49 && prefix[4]===0x49;
  const isUnicode = prefix[0]===0x55 && prefix[1]===0x4E && prefix[2]===0x49 && prefix[3]===0x43 && prefix[4]===0x4F && prefix[5]===0x44 && prefix[6]===0x45;
  if (isAscii) {
    return payload.map(b => b?String.fromCharCode(b):'').join('').trim();
  }
  if (isUnicode) {
    const u16 = new Uint16Array(new Uint8Array(payload).buffer);
    return String.fromCharCode(...u16).replace(/\0/g,'').trim();
  }
  // Unknown encoding, try as ASCII
  return payload.filter(b=>b>=32&&b<127).map(b=>String.fromCharCode(b)).join('').trim() || null;
}

function parseExifFromTiff(dv, tiffStart) {
  if (tiffStart + 8 > dv.byteLength) return {};
  const bo = readU16(dv, tiffStart, false);
  const le = (bo === 0x4949);
  const magic = readU16(dv, tiffStart+2, le);
  if (magic !== 0x002A) return {};
  const ifd0Off = readU32(dv, tiffStart+4, le);
  let tags = parseIFD(dv, ifd0Off, tiffStart, le);
  // Sub-IFD (Exif)
  if (tags[0x8769]) {
    const exifOff = tags[0x8769];
    const exifTags = parseIFD(dv, exifOff, tiffStart, le);
    Object.assign(tags, exifTags);
  }
  // GPS IFD
  if (tags[0x8825]) {
    const gpsOff = tags[0x8825];
    const gpsTags = parseIFD(dv, gpsOff, tiffStart, le);
    for (const [k,v] of Object.entries(gpsTags)) tags['GPS_'+k] = v;
  }
  return tags;
}

function parseJpegExif(buf) {
  const dv = new DataView(buf);
  let tags = {};
  let xmpDesc = null;
  if (dv.getUint16(0) !== 0xFFD8) return { tags, xmpDesc };
  let off = 2;
  while (off < dv.byteLength - 4) {
    const marker = dv.getUint16(off);
    if (marker === 0xFFDA || marker === 0xFFD9) break; // SOS or EOI
    const segLen = dv.getUint16(off+2);
    if (marker === 0xFFE1) {
      // Check for Exif
      if (readAscii(dv, off+4, 4) === 'Exif' && dv.getUint8(off+8) === 0 && dv.getUint8(off+9) === 0) {
        const tiffStart = off + 10;
        tags = parseExifFromTiff(dv, tiffStart);
      }
      // Check for XMP
      const xmpId = 'http://ns.adobe.com/xap/1.0/\0';
      let isXmp = true;
      for (let i=0; i<xmpId.length && isXmp; i++) {
        if (off+4+i >= dv.byteLength || String.fromCharCode(dv.getUint8(off+4+i)) !== xmpId[i]) isXmp = false;
      }
      if (isXmp) {
        const xmpStart = off + 4 + xmpId.length;
        const xmpLen = segLen - 2 - xmpId.length;
        const xmpBytes = new Uint8Array(buf, xmpStart, xmpLen);
        const xmpStr = new TextDecoder().decode(xmpBytes);
        const m = xmpStr.match(/<dc:description[\s\S]*?<rdf:li[^>]*>([^<]*)<\/rdf:li>/);
        if (m) xmpDesc = m[1].trim();
      }
    }
    off += 2 + segLen;
  }
  return { tags, xmpDesc };
}

function parsePngText(buf) {
  const dv = new DataView(buf);
  const tags = {};
  let off = 8; // skip PNG signature
  while (off + 8 <= dv.byteLength) {
    const len = dv.getUint32(off);
    const typeBytes = new Uint8Array(buf, off+4, 4);
    const type = String.fromCharCode(...typeBytes);
    if (type === 'IDAT' || type === 'IEND') break;
    const dataStart = off + 8;
    if (type === 'tEXt' && len > 0) {
      const data = new Uint8Array(buf, dataStart, len);
      let nul = data.indexOf(0);
      if (nul < 0) nul = len;
      const key = new TextDecoder('latin1').decode(data.slice(0, nul));
      const val = new TextDecoder('latin1').decode(data.slice(nul+1));
      tags[key] = val;
    }
    if (type === 'iTXt' && len > 0) {
      const data = new Uint8Array(buf, dataStart, len);
      let nul = data.indexOf(0);
      if (nul < 0) nul = len;
      const key = new TextDecoder().decode(data.slice(0, nul));
      // skip compression flag, method, lang, translated keyword
      let pos = nul+1;
      // compressionFlag, compressionMethod
      pos += 2;
      // lang (null-terminated)
      let nul2 = data.indexOf(0, pos);
      if (nul2 < 0) nul2 = len;
      pos = nul2 + 1;
      // translated keyword (null-terminated)
      let nul3 = data.indexOf(0, pos);
      if (nul3 < 0) nul3 = len;
      pos = nul3 + 1;
      const val = new TextDecoder().decode(data.slice(pos));
      tags[key] = val;
    }
    off += 8 + len + 4; // 4 for CRC
  }
  return tags;
}

function parseWebpExif(buf) {
  const dv = new DataView(buf);
  if (readAscii(dv, 0, 4) !== 'RIFF' || readAscii(dv, 8, 4) !== 'WEBP') return {};
  let off = 12;
  while (off + 8 <= dv.byteLength) {
    const chunkId = readAscii(dv, off, 4);
    const chunkSize = dv.getUint32(off+4, true);
    if (chunkId === 'EXIF') {
      let tiffStart = off + 8;
      // Some WebP files have "Exif\0\0" prefix before TIFF
      if (tiffStart + 6 <= dv.byteLength && readAscii(dv, tiffStart, 4) === 'Exif') {
        tiffStart += 6;
      }
      return parseExifFromTiff(dv, tiffStart);
    }
    off += 8 + chunkSize + (chunkSize & 1); // pad to even
  }
  return {};
}

async function readMetadata(entry) {
  let file;
  if (entry.handle) file = await entry.handle.getFile();
  else file = entry.file;

  const readSize = Math.min(file.size, 256 * 1024);
  const buf = await file.slice(0, readSize).arrayBuffer();
  const ext = fileExt(entry.name);
  let tags = {};
  let description = '';
  let xmpDesc = null;
  let pngTextTags = {};

  if (ext === 'jpg' || ext === 'jpeg') {
    const result = parseJpegExif(buf);
    tags = result.tags;
    xmpDesc = result.xmpDesc;
  } else if (ext === 'png') {
    pngTextTags = parsePngText(buf);
    // Also check for eXIf chunk in PNG (rare but possible)
  } else if (ext === 'webp') {
    tags = parseWebpExif(buf);
  } else if (ext === 'tiff' || ext === 'tif') {
    const dv = new DataView(buf);
    tags = parseExifFromTiff(dv, 0);
  }

  // Determine description (priority: ImageDescription > XMP > PNG text > UserComment)
  if (tags[0x010E] && typeof tags[0x010E] === 'string' && tags[0x010E].trim()) {
    description = tags[0x010E].trim();
  } else if (xmpDesc) {
    description = xmpDesc;
  } else if (pngTextTags['Description']) {
    description = pngTextTags['Description'];
  } else if (tags[0x9286]) {
    const uc = decodeUserComment(tags[0x9286]);
    if (uc) description = uc;
  }

  // Build named tags
  const namedTags = {};
  for (const [k,v] of Object.entries(tags)) {
    const tagId = parseInt(k);
    const name = EXIF_TAG_NAMES[tagId] || ('Tag_0x' + tagId.toString(16).toUpperCase().padStart(4,'0'));
    if (tagId === 0x8769 || tagId === 0x8825) continue; // skip IFD pointers
    let val = v;
    if (Array.isArray(val)) {
      if (tagId === 0x9286) {
        val = decodeUserComment(val) || '(binary)';
      } else {
        val = val.length > 32 ? '(binary, ' + val.length + ' bytes)' : val.join(', ');
      }
    }
    if (typeof val === 'number') val = String(Math.round(val * 10000) / 10000);
    namedTags[name] = String(val);
  }
  for (const [k,v] of Object.entries(pngTextTags)) {
    namedTags['PNG:' + k] = v;
  }

  return {
    tags: namedTags,
    description,
    fileSize: file.size,
    lastModified: new Date(file.lastModified),
    type: file.type || ('image/' + ext),
  };
}

async function loadMetadata(entry) {
  currentMeta = null;
  currentDescription = '';
  $descText.textContent = '(No description)';
  $descText.classList.add('empty');
  $fileInfo.textContent = '';
  $tagsBody.innerHTML = '';
  allMetaVisible = false;
  $tagsTable.classList.remove('visible');
  $btnShowAllMeta.textContent = 'Show All Metadata';

  updateEditButton(entry);

  try {
    const meta = await readMetadata(entry);
    currentMeta = meta;
    currentDescription = meta.description;

    if (meta.description) {
      $descText.textContent = meta.description;
      $descText.classList.remove('empty');
    } else {
      $descText.textContent = '(No description)';
      $descText.classList.add('empty');
    }

    // File info
    const lines = [];
    lines.push('Size: ' + formatSize(meta.fileSize));
    lines.push('Format: ' + meta.type);
    if (naturalW && naturalH) lines.push('Dimensions: ' + naturalW + ' x ' + naturalH);
    lines.push('Modified: ' + meta.lastModified.toLocaleString());
    $fileInfo.textContent = lines.join('\n');

    // Tags
    const sorted = Object.entries(meta.tags).sort((a,b) => a[0].localeCompare(b[0]));
    $tagsBody.innerHTML = '';
    for (const [k,v] of sorted) {
      const tr = document.createElement('tr');
      tr.innerHTML = '<td>' + escHtml(k) + '</td><td>' + escHtml(String(v)) + '</td>';
      $tagsBody.appendChild(tr);
    }
    $btnShowAllMeta.textContent = 'Show All Metadata (' + sorted.length + ' tags)';
  } catch(e) {
    $fileInfo.textContent = 'Error reading metadata: ' + e.message;
  }
}

function updateEditButton(entry) {
  const ext = fileExt(entry.name);
  const writable = useFSAPI && (ext === 'jpg' || ext === 'jpeg' || ext === 'png');
  if (writable) {
    $btnEditDesc.classList.remove('disabled');
    $btnEditDesc.title = 'Edit description';
  } else {
    $btnEditDesc.classList.add('disabled');
    if (!useFSAPI) {
      $btnEditDesc.title = 'Editing requires File System Access API (use Chrome/Edge with Open Folder button)';
    } else {
      $btnEditDesc.title = 'Description editing not supported for this format';
    }
  }
}

$btnShowAllMeta.addEventListener('click', () => {
  allMetaVisible = !allMetaVisible;
  $tagsTable.classList.toggle('visible', allMetaVisible);
  $btnShowAllMeta.textContent = (allMetaVisible ? 'Hide' : 'Show') + ' All Metadata' +
    ($tagsBody.children.length ? ' (' + $tagsBody.children.length + ' tags)' : '');
});

// --- Description Editing ---
$btnEditDesc.addEventListener('click', () => {
  if ($btnEditDesc.classList.contains('disabled')) return;
  openEditModal();
});

function openEditModal() {
  modalOpen = true;
  $modalTextarea.value = currentDescription;
  $modalOverlay.classList.add('open');
  $modalTextarea.focus();
}

function closeEditModal() {
  modalOpen = false;
  $modalOverlay.classList.remove('open');
}

$btnModalCancel.addEventListener('click', closeEditModal);

$btnModalSave.addEventListener('click', async () => {
  const newDesc = $modalTextarea.value;
  const entry = flat[currentIdx];
  if (!entry || !entry.handle) return;
  const ext = fileExt(entry.name);
  setStatus('Saving description...');
  closeEditModal();

  try {
    if (ext === 'jpg' || ext === 'jpeg') {
      await writeJpegDescription(entry.handle, newDesc);
    } else if (ext === 'png') {
      await writePngDescription(entry.handle, newDesc);
    }
    currentDescription = newDesc;
    if (newDesc) {
      $descText.textContent = newDesc;
      $descText.classList.remove('empty');
    } else {
      $descText.textContent = '(No description)';
      $descText.classList.add('empty');
    }
    // Refresh object URL since file changed
    revokeObjectURL(entry);
    const url = await createObjectURL(entry);
    $img.src = url;
    setStatus('Description saved.');
    // Reload metadata
    loadMetadata(entry);
  } catch(e) {
    setStatus('Error saving: ' + e.message);
  }
});

// --- JPEG Description Writer ---
async function writeJpegDescription(fileHandle, desc) {
  const file = await fileHandle.getFile();
  const buf = await file.arrayBuffer();
  const data = new Uint8Array(buf);
  const dv = new DataView(buf);

  if (dv.getUint16(0) !== 0xFFD8) throw new Error('Not a JPEG');

  let off = 2;
  let app1Start = -1, app1Len = 0;
  let isExifApp1 = false;

  // Find existing EXIF APP1
  while (off < data.length - 4) {
    const marker = dv.getUint16(off);
    if (marker === 0xFFDA || marker === 0xFFD9) break;
    const segLen = dv.getUint16(off+2);
    if (marker === 0xFFE1) {
      if (readAscii(dv, off+4, 4) === 'Exif' && dv.getUint8(off+8) === 0 && dv.getUint8(off+9) === 0) {
        app1Start = off;
        app1Len = 2 + segLen;
        isExifApp1 = true;
        break;
      }
    }
    off += 2 + segLen;
  }

  let newFile;
  if (isExifApp1) {
    // Patch existing EXIF
    const tiffStart = app1Start + 10;
    const tiffData = new Uint8Array(buf, tiffStart, app1Len - 10);
    const newTiff = patchExifDescription(tiffData, desc);
    // Build new APP1
    const app1Data = new Uint8Array(10 + newTiff.length);
    app1Data[0] = 0xFF; app1Data[1] = 0xE1;
    const newSegLen = 2 + 6 + newTiff.length;
    app1Data[2] = (newSegLen >> 8) & 0xFF; app1Data[3] = newSegLen & 0xFF;
    // Exif\0\0
    app1Data[4] = 0x45; app1Data[5] = 0x78; app1Data[6] = 0x69; app1Data[7] = 0x66;
    app1Data[8] = 0; app1Data[9] = 0;
    app1Data.set(newTiff, 10);

    // Reassemble
    newFile = new Uint8Array(app1Start + app1Data.length + (data.length - app1Start - app1Len));
    newFile.set(data.slice(0, app1Start));
    newFile.set(app1Data, app1Start);
    newFile.set(data.slice(app1Start + app1Len), app1Start + app1Data.length);
  } else {
    // Create minimal EXIF APP1 with description
    const descBytes = new TextEncoder().encode(desc);
    // Build TIFF: big-endian, single IFD0 with tag 270
    const ifdEntryCount = 1;
    const ifdSize = 2 + ifdEntryCount * 12 + 4; // count + entries + next IFD pointer
    const dataOffset = 8 + ifdSize; // TIFF header(8) + IFD
    const tiffLen = dataOffset + descBytes.length + 1; // +1 for null terminator
    const tiff = new Uint8Array(tiffLen);
    const tdv = new DataView(tiff.buffer);
    // TIFF header: big-endian
    tiff[0] = 0x4D; tiff[1] = 0x4D; // MM
    tdv.setUint16(2, 0x002A, false);
    tdv.setUint32(4, 8, false); // IFD0 offset
    // IFD0
    tdv.setUint16(8, ifdEntryCount, false);
    // Tag 270 (ImageDescription), type ASCII(2)
    tdv.setUint16(10, 270, false);
    tdv.setUint16(12, 2, false); // type: ASCII
    const strLen = descBytes.length + 1;
    tdv.setUint32(14, strLen, false); // count
    if (strLen <= 4) {
      // Inline
      for (let i=0; i<descBytes.length; i++) tiff[18+i] = descBytes[i];
      tiff[18+descBytes.length] = 0;
    } else {
      tdv.setUint32(18, dataOffset, false); // offset to data
      tiff.set(descBytes, dataOffset);
      tiff[dataOffset + descBytes.length] = 0;
    }
    tdv.setUint32(22, 0, false); // next IFD: none

    // Build APP1 segment
    const app1Payload = new Uint8Array(8 + tiff.length);
    // Exif\0\0
    app1Payload[0] = 0x45; app1Payload[1] = 0x78; app1Payload[2] = 0x69; app1Payload[3] = 0x66;
    app1Payload[4] = 0; app1Payload[5] = 0;
    app1Payload.set(tiff, 6);

    const segLen = 2 + app1Payload.length;
    const app1Seg = new Uint8Array(4 + app1Payload.length);
    app1Seg[0] = 0xFF; app1Seg[1] = 0xE1;
    app1Seg[2] = (segLen >> 8) & 0xFF; app1Seg[3] = segLen & 0xFF;
    app1Seg.set(app1Payload, 4);

    // Insert after SOI (first 2 bytes)
    newFile = new Uint8Array(2 + app1Seg.length + data.length - 2);
    newFile[0] = 0xFF; newFile[1] = 0xD8;
    newFile.set(app1Seg, 2);
    newFile.set(data.slice(2), 2 + app1Seg.length);
  }

  const writable = await fileHandle.createWritable();
  await writable.write(newFile);
  await writable.close();
}

function patchExifDescription(tiffBytes, desc) {
  const buf = tiffBytes.buffer.slice(tiffBytes.byteOffset, tiffBytes.byteOffset + tiffBytes.byteLength);
  const dv = new DataView(buf);
  const bo = dv.getUint16(0, false);
  const le = (bo === 0x4949);
  const magic = readU16(dv, 2, le);
  if (magic !== 0x002A) return tiffBytes; // can't parse, return as-is

  const ifd0Off = readU32(dv, 4, le);
  const entryCount = readU16(dv, ifd0Off, le);

  // Collect existing IFD0 entries except tag 270
  const entries = [];
  for (let i=0; i<entryCount; i++) {
    const eOff = ifd0Off + 2 + i*12;
    const tag = readU16(dv, eOff, le);
    if (tag === 270) continue; // skip old ImageDescription
    entries.push(new Uint8Array(buf, eOff, 12));
  }

  // Next IFD pointer
  const nextIfdOff = ifd0Off + 2 + entryCount * 12;
  let nextIfd = 0;
  if (nextIfdOff + 4 <= buf.byteLength) {
    nextIfd = readU32(dv, nextIfdOff, le);
  }

  // Build new tag 270
  const descBytes = new TextEncoder().encode(desc);
  const strCount = descBytes.length + 1; // include null terminator

  // We'll rebuild the TIFF with: header(8) + IFD0 + external data
  const newEntryCount = entries.length + 1;
  const ifdBodySize = 2 + newEntryCount * 12 + 4;
  const newIfd0Off = 8;
  let externalOff = newIfd0Off + ifdBodySize;

  // Collect all external data for old entries + new description
  const externalChunks = [];

  // Clone and fix old entries
  const newEntries = [];
  for (const oldEntry of entries) {
    const eDv = new DataView(oldEntry.buffer, oldEntry.byteOffset, 12);
    const tag = readU16(eDv, 0, le);
    const type = readU16(eDv, 2, le);
    const cnt = readU32(eDv, 4, le);
    const typeSizes = {1:1,2:1,3:2,4:4,5:8,7:1,9:4,10:8};
    const sz = (typeSizes[type]||1)*cnt;
    const entryCopy = new Uint8Array(12);
    entryCopy.set(oldEntry);

    if (sz > 4) {
      // External data - copy from old TIFF
      const oldValueOff = readU32(eDv, 8, le);
      if (oldValueOff + sz <= buf.byteLength) {
        const chunk = new Uint8Array(buf, oldValueOff, sz);
        const newDv = new DataView(entryCopy.buffer, 0, 12);
        if (le) newDv.setUint32(8, externalOff - 0, true); // offset from TIFF start, but TIFF starts at 0 in new buffer
        else newDv.setUint32(8, externalOff - 0, false);
        // Actually offset is relative to TIFF start which is byte 0 in our new TIFF
        // In new layout: TIFF header starts at 0, IFD0 at 8, external data at externalOff
        // But wait, offsets in TIFF are from TIFF start (byte 0), which in our layout IS byte 0
        const chunkCopy = new Uint8Array(sz);
        chunkCopy.set(chunk);
        externalChunks.push({ offset: externalOff, data: chunkCopy });
        const entryDv = new DataView(entryCopy.buffer);
        if (le) entryDv.setUint32(8, externalOff, true);
        else entryDv.setUint32(8, externalOff, false);
        externalOff += sz;
        // Align to word boundary
        if (externalOff & 1) externalOff++;
      }
    }
    newEntries.push({ tag, data: entryCopy });
  }

  // Add new tag 270
  const descEntry = new Uint8Array(12);
  const descEntryDv = new DataView(descEntry.buffer);
  if (le) {
    descEntryDv.setUint16(0, 270, true);
    descEntryDv.setUint16(2, 2, true); // ASCII
    descEntryDv.setUint32(4, strCount, true);
  } else {
    descEntryDv.setUint16(0, 270, false);
    descEntryDv.setUint16(2, 2, false);
    descEntryDv.setUint32(4, strCount, false);
  }
  if (strCount <= 4) {
    for (let i=0; i<descBytes.length; i++) descEntry[8+i] = descBytes[i];
    descEntry[8+descBytes.length] = 0;
  } else {
    if (le) descEntryDv.setUint32(8, externalOff, true);
    else descEntryDv.setUint32(8, externalOff, false);
    const descData = new Uint8Array(strCount);
    descData.set(descBytes);
    descData[descBytes.length] = 0;
    externalChunks.push({ offset: externalOff, data: descData });
    externalOff += strCount;
    if (externalOff & 1) externalOff++;
  }
  newEntries.push({ tag: 270, data: descEntry });

  // Sort by tag ID
  newEntries.sort((a,b) => a.tag - b.tag);

  // Build new TIFF
  const totalSize = externalOff;
  const newTiff = new Uint8Array(totalSize);
  const newDv = new DataView(newTiff.buffer);

  // TIFF header
  if (le) { newTiff[0]=0x49; newTiff[1]=0x49; }
  else { newTiff[0]=0x4D; newTiff[1]=0x4D; }
  if (le) newDv.setUint16(2, 0x002A, true);
  else newDv.setUint16(2, 0x002A, false);
  if (le) newDv.setUint32(4, newIfd0Off, true);
  else newDv.setUint32(4, newIfd0Off, false);

  // IFD0
  if (le) newDv.setUint16(newIfd0Off, newEntryCount, true);
  else newDv.setUint16(newIfd0Off, newEntryCount, false);
  for (let i=0; i<newEntries.length; i++) {
    newTiff.set(newEntries[i].data, newIfd0Off + 2 + i*12);
  }
  // Next IFD pointer (0 = none)
  const nextIfdPtrOff = newIfd0Off + 2 + newEntryCount * 12;
  if (le) newDv.setUint32(nextIfdPtrOff, 0, true);
  else newDv.setUint32(nextIfdPtrOff, 0, false);

  // External data
  for (const chunk of externalChunks) {
    newTiff.set(chunk.data, chunk.offset);
  }

  return newTiff;
}

// --- PNG Description Writer ---
async function writePngDescription(fileHandle, desc) {
  const file = await fileHandle.getFile();
  const buf = await file.arrayBuffer();
  const data = new Uint8Array(buf);
  const dv = new DataView(buf);

  // Verify PNG signature
  const sig = [137, 80, 78, 71, 13, 10, 26, 10];
  for (let i=0; i<8; i++) if (data[i] !== sig[i]) throw new Error('Not a PNG');

  // Parse chunks
  const chunks = [];
  let off = 8;
  let firstIdatIdx = -1;
  while (off + 8 <= data.length) {
    const len = dv.getUint32(off);
    const typeBytes = new Uint8Array(buf, off+4, 4);
    const type = String.fromCharCode(...typeBytes);
    const chunkData = new Uint8Array(buf, off+8, len);
    const crcVal = dv.getUint32(off+8+len);

    // Skip old Description tEXt chunks
    let skip = false;
    if (type === 'tEXt') {
      const nul = chunkData.indexOf(0);
      const key = nul >= 0 ? new TextDecoder('latin1').decode(chunkData.slice(0, nul)) : '';
      if (key === 'Description') skip = true;
    }
    if (!skip) {
      if (type === 'IDAT' && firstIdatIdx < 0) firstIdatIdx = chunks.length;
      chunks.push({ type, data: new Uint8Array(chunkData), crc: crcVal });
    }
    off += 8 + len + 4;
  }

  // Build new Description tEXt chunk
  if (desc) {
    const keyBytes = new TextEncoder().encode('Description');
    const valBytes = new TextEncoder().encode(desc);
    const chunkPayload = new Uint8Array(keyBytes.length + 1 + valBytes.length);
    chunkPayload.set(keyBytes);
    chunkPayload[keyBytes.length] = 0;
    chunkPayload.set(valBytes, keyBytes.length + 1);

    const typeAndData = new Uint8Array(4 + chunkPayload.length);
    typeAndData[0] = 0x74; typeAndData[1] = 0x45; typeAndData[2] = 0x58; typeAndData[3] = 0x74; // tEXt
    typeAndData.set(chunkPayload, 4);
    const newCrc = crc32(typeAndData, 0, typeAndData.length);

    const insertIdx = firstIdatIdx >= 0 ? firstIdatIdx : chunks.length;
    chunks.splice(insertIdx, 0, { type: 'tEXt', data: chunkPayload, crc: newCrc });
  }

  // Reassemble PNG
  let totalSize = 8;
  for (const c of chunks) totalSize += 12 + c.data.length;
  const out = new Uint8Array(totalSize);
  out.set(sig);
  let pos = 8;
  for (const c of chunks) {
    const cdv = new DataView(out.buffer, pos);
    cdv.setUint32(0, c.data.length);
    const tb = new TextEncoder().encode(c.type);
    out.set(tb, pos+4);
    out.set(c.data, pos+8);

    // Recompute CRC for our new chunk; keep original CRC for unchanged chunks
    if (c.type === 'tEXt') {
      const crcBuf = new Uint8Array(4 + c.data.length);
      crcBuf.set(tb);
      crcBuf.set(c.data, 4);
      const newCrc = crc32(crcBuf, 0, crcBuf.length);
      cdv.setUint32(8 + c.data.length, newCrc);
    } else {
      cdv.setUint32(8 + c.data.length, c.crc);
    }
    pos += 12 + c.data.length;
  }

  const writable = await fileHandle.createWritable();
  await writable.write(out);
  await writable.close();
}

// --- Keyboard Shortcuts ---
document.addEventListener('keydown', e => {
  if (modalOpen) {
    if (e.key === 'Escape') closeEditModal();
    return;
  }

  if (e.ctrlKey && e.key === 'o') {
    e.preventDefault();
    openFolder();
    return;
  }

  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  switch(e.key) {
    case 'ArrowLeft':
      e.preventDefault();
      if (currentIdx > 0) navigate(currentIdx - 1);
      break;
    case 'ArrowRight':
      e.preventDefault();
      if (currentIdx < flat.length - 1) navigate(currentIdx + 1);
      break;
    case 'ArrowUp':
      e.preventDefault();
      if (currentIdx >= 0) {
        const rect = $viewport.getBoundingClientRect();
        zoomAt(rect.width/2, rect.height/2, 1.25);
      }
      break;
    case 'ArrowDown':
      e.preventDefault();
      if (currentIdx >= 0) {
        const rect = $viewport.getBoundingClientRect();
        zoomAt(rect.width/2, rect.height/2, 1/1.25);
      }
      break;
    case 'PageUp':
      e.preventDefault();
      if (currentIdx >= 0) {
        const gIdx = flat[currentIdx].groupIdx;
        if (gIdx > 0) navigate(groupBounds[gIdx - 1]);
      }
      break;
    case 'PageDown':
      e.preventDefault();
      if (currentIdx >= 0) {
        const gIdx = flat[currentIdx].groupIdx;
        if (gIdx < groups.length - 1) navigate(groupBounds[gIdx + 1]);
      }
      break;
    case 'Home':
      e.preventDefault();
      if (flat.length > 0) navigate(0);
      break;
    case 'End':
      e.preventDefault();
      if (flat.length > 0) navigate(flat.length - 1);
      break;
    case 'f': case 'F':
      if (currentIdx >= 0) fitToView();
      break;
    case 'm': case 'M':
      metaVisible = !metaVisible;
      $metaPanel.classList.toggle('visible', metaVisible);
      $rightSplitter.style.display = metaVisible ? 'block' : 'none';
      if (isFitMode && currentIdx >= 0) setTimeout(() => fitToView(), 0);
      break;
  }
});

// --- Splitters ---
function initSplitter(splitter, panel, side, minW, maxW) {
  let startX, startW, active = false;
  splitter.addEventListener('mousedown', e => {
    e.preventDefault();
    active = true;
    startX = e.clientX;
    startW = panel.offsetWidth;
    splitter.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  });
  window.addEventListener('mousemove', e => {
    if (!active) return;
    const dx = side === 'left' ? (e.clientX - startX) : (startX - e.clientX);
    const newW = Math.min(maxW, Math.max(minW, startW + dx));
    panel.style.width = newW + 'px';
  });
  window.addEventListener('mouseup', () => {
    if (!active) return;
    active = false;
    splitter.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    if (isFitMode && currentIdx >= 0) fitToView();
  });
}

initSplitter($leftSplitter, $dirTreePanel, 'left', 120, 500);
initSplitter($rightSplitter, $metaPanel, 'right', 150, 600);

// --- Init ---
$metaPanel.classList.add('visible');
$rightSplitter.style.display = 'block';

})();
</script>
